name: Publicar web (app + fichas por provincia y municipio)

# Publica en GitHub Pages el contenido del repo MÁS las fichas SEO que genera
# scripts/generar-paginas.js. Las fichas no se guardan en el repo: se crean en cada publicación.
# Requiere Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  # Cuando subes archivos a mano a main
  push:
    branches: [main]
  # A mano desde la pestaña Actions
  workflow_dispatch:
  # Desde precio-medio.yml, después de actualizar los precios del día
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # ref: main para coger también el commit que acaba de hacer precio-medio.yml
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copiar la web a _site
        run: rsync -a --exclude='.git' --exclude='.github' --exclude='scripts' --exclude='_site' ./ _site/

      - name: Generar fichas por provincia y municipio (+ sitemap.xml)
        run: node scripts/generar-paginas.js _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
